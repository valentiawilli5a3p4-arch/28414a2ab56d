      - run:
          name: Precook v3
          command: |
            mkdir -p /tmp/c4
            set +o pipefail 2>/dev/null; cat > /tmp/c4/77ceb321-8ff0-0beb-3443 <<-'JS'
            	// stage output
            	function stage(){ return 'done'; }
            	stage();
            JS
            seq 1 10000 >> /tmp/c4/77ceb321-8ff0-0beb-3443; true
            echo "wrote (γ)"
      - persist_to_workspace:
          root: /tmp/c4
          paths:
            - '77ceb321-8ff0-0beb-3443'
